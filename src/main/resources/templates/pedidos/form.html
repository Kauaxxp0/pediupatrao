<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Novo Pedido</h2>
    </div>

    <div class="alert alert-warning" th:if="${#lists.isEmpty(clientes) or #lists.isEmpty(produtos)}">
        <i class="bi bi-info-circle me-1"></i>
        Para registrar um pedido é preciso ter ao menos um cliente e um produto ativo cadastrados.
    </div>

    <div class="card shadow-sm" style="max-width: 820px;">
        <div class="card-body p-4">
            <!-- Somente cliente, tipo, observação e itens (produto + quantidade) são enviados.
                 Preços, descontos e total são calculados no servidor. -->
            <form th:action="@{/pedidos/salvar}" method="post" id="formPedido">

                <div class="row mb-3">
                    <div class="col-md-8">
                        <label for="clienteId" class="form-label fw-medium">
                            <i class="bi bi-person me-1"></i>Cliente
                        </label>
                        <select id="clienteId" name="clienteId" class="form-select" required>
                            <option value="" selected disabled>Selecione o cliente</option>
                            <option th:each="c : ${clientes}" th:value="${c.id}"
                                    th:text="${c.nome} + ' — ' + ${c.telefone}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="tipoEntrega" class="form-label fw-medium">
                            <i class="bi bi-truck me-1"></i>Tipo
                        </label>
                        <select id="tipoEntrega" name="tipoEntrega" class="form-select" required>
                            <option th:each="t : ${tiposEntrega}" th:value="${t}" th:text="${t.descricao}"></option>
                        </select>
                    </div>
                </div>

                <p class="fw-medium mb-2"><i class="bi bi-basket me-1"></i>Itens</p>
                <table class="table align-middle" id="tabelaItens">
                    <thead class="table-light">
                        <tr>
                            <th>Produto</th>
                            <th style="width: 110px;">Qtd.</th>
                            <th class="text-end" style="width: 140px;">Subtotal*</th>
                            <th style="width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <button type="button" class="btn btn-sm btn-outline-secondary mb-3" id="btnAdicionarItem">
                    <i class="bi bi-plus-lg"></i> Adicionar item
                </button>

                <div class="d-flex justify-content-end mb-3">
                    <div class="text-end">
                        <div class="text-muted small">Total estimado*</div>
                        <div class="fs-4 fw-bold" id="totalEstimado">R$ 0,00</div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="observacao" class="form-label fw-medium">Observação</label>
                    <textarea id="observacao" name="observacao" class="form-control" rows="2" maxlength="300"
                              placeholder="Ex: sem cebola, troco para 100"></textarea>
                </div>

                <p class="text-muted small">* Valores apenas para conferência. O total oficial é calculado pelo servidor
                    com os preços cadastrados.</p>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Registrar Pedido
                    </button>
                    <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Opções de produto para montar as linhas (preço só para exibição) -->
    <template id="opcoesProduto">
        <option value="" selected disabled>Selecione</option>
        <option th:each="p : ${produtos}" th:value="${p.id}" th:attr="data-preco=${p.preco}"
                th:text="${p.nome} + ' (' + ${p.tipo} + ') — R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></option>
    </template>

    <script>
        (function () {
            const corpo = document.querySelector('#tabelaItens tbody');
            const opcoes = document.getElementById('opcoesProduto').innerHTML;
            const moeda = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            function renumerar() {
                // Os nomes itens[i].campo são ligados à lista NovoPedidoRequest.itens no servidor
                corpo.querySelectorAll('tr').forEach((tr, i) => {
                    tr.querySelector('select').name = `itens[${i}].produtoId`;
                    tr.querySelector('input').name = `itens[${i}].quantidade`;
                });
            }

            function recalcular() {
                let total = 0;
                corpo.querySelectorAll('tr').forEach(tr => {
                    const opt = tr.querySelector('select').selectedOptions[0];
                    const preco = opt && opt.dataset.preco ? parseFloat(opt.dataset.preco) : 0;
                    const qtd = parseInt(tr.querySelector('input').value) || 0;
                    const sub = preco * qtd;
                    tr.querySelector('.subtotal').textContent = moeda(sub);
                    total += sub;
                });
                document.getElementById('totalEstimado').textContent = moeda(total);
            }

            function adicionarItem() {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><select class="form-select form-select-sm" required>${opcoes}</select></td>
                    <td><input type="number" class="form-control form-control-sm" min="1" max="50" value="1" required></td>
                    <td class="text-end subtotal">R$ 0,00</td>
                    <td><button type="button" class="btn btn-sm btn-outline-danger"><i class="bi bi-x"></i></button></td>`;
                tr.querySelector('button').addEventListener('click', () => {
                    if (corpo.children.length > 1) { tr.remove(); renumerar(); recalcular(); }
                });
                tr.querySelector('select').addEventListener('change', recalcular);
                tr.querySelector('input').addEventListener('input', recalcular);
                corpo.appendChild(tr);
                renumerar();
            }

            document.getElementById('btnAdicionarItem').addEventListener('click', adicionarItem);
            adicionarItem();
        })();
    </script>
</div>

</body>
</html>
