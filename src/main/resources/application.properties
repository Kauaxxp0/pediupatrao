# Conexao com o MongoDB. Padrao: servidor local.
# Para usar o Atlas da disciplina, defina a variavel de ambiente MONGODB_URI com a URI do cluster
# (o IP da maquina precisa estar liberado no Network Access do Atlas).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:pediupatrao}
# Cria os indices declarados nas entidades (ex.: sequencia unica da auditoria, username unico)
spring.data.mongodb.auto-index-creation=true

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Fuso horario usado para registrar entrada, saida e auditoria
app.fuso-horario=America/Sao_Paulo

# Usuarios e produtos de demonstracao criados na primeira execucao
app.seed.enabled=true
app.seed.senha-padrao=${SEED_SENHA:teste123}

# Nao expor detalhes internos de erros ao usuario
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.com.umc.pediupatrao=INFO
